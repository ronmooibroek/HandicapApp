<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Golf Handicap</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #e8f0e5;
    --bg-card:   #f4f8f2;
    --bg-white:  #ffffff;
    --header-bg: #2c4f2c;
    --green-dk:  #2c4f2c;
    --green-md:  #3d6e3d;
    --green-lt:  #5a9e5a;
    --green-pale:#c8dfc4;
    --gold:      #b8942a;
    --gold-lt:   #d4ae48;
    --gold-pale: #f5ecd0;
    --text:      #1c2e1c;
    --text-mid:  #3a4e3a;
    --text-muted:#7a927a;
    --border:    #cddec9;
    --border-lt: #ddeedd;
    --red:       #c0392b;
    --shadow:    0 2px 12px rgba(44,79,44,0.10);
    --shadow-md: 0 4px 24px rgba(44,79,44,0.14);
    --shadow-lg: 0 8px 48px rgba(44,79,44,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: var(--header-bg);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .header-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 32px;
    height: 62px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    color: #d4ae48;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .logo span { color: #c8dfc4; font-style: italic; }
  nav { display: flex; gap: 4px; flex: 1; }
  .nav-btn {
    background: none;
    border: none;
    color: rgba(200,223,196,0.65);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .nav-btn:hover { color: #c8dfc4; background: rgba(255,255,255,0.08); }
  .nav-btn.active { color: #d4ae48; background: rgba(212,174,72,0.15); }

  .main { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }

  .view { display: none; }
  .view.active { display: block; }

  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--green-dk);
    margin-bottom: 4px;
  }
  .page-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

  .card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .hcp-hero {
    background: linear-gradient(135deg, var(--green-dk) 0%, var(--green-md) 100%);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .hcp-hero::before {
    content: '⛳';
    position: absolute;
    font-size: 130px;
    right: -10px;
    bottom: -20px;
    opacity: 0.08;
  }
  .hcp-label {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #d4ae48;
    margin-bottom: 10px;
  }
  .hcp-value {
    font-family: 'Playfair Display', serif;
    font-size: 76px;
    font-weight: 700;
    color: #d4ae48;
    line-height: 1;
    margin-bottom: 8px;
  }
  .hcp-value.no-data { font-size: 28px; color: rgba(200,223,196,0.45); }
  .hcp-sub { font-size: 13px; color: rgba(200,223,196,0.6); }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--green-dk);
    margin-bottom: 4px;
  }
  .stat-lbl { font-size: 12px; color: var(--text-muted); }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--green-dk);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .score-list { display: flex; flex-direction: column; gap: 8px; }
  .score-row {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 1fr auto auto auto auto auto;
    align-items: center;
    gap: 14px;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .score-row:hover { border-color: var(--gold); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .score-row:active { transform: translateY(0); }
  .score-course { font-weight: 600; font-size: 14px; color: var(--text); }
  .score-tee { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .score-gross {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--green-dk);
    text-align: right;
  }
  .score-diff { text-align: right; }
  .score-stableford { font-size: 13px; color: var(--text-muted); text-align: right; }
  .del-btn {
    background: none;
    border: none;
    color: var(--border);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 4px;
    transition: color 0.18s;
    line-height: 1;
  }
  .del-btn:hover { color: var(--red); }

  .courses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }
  .course-card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
    transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  }
  .course-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .course-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--green-dk);
    margin-bottom: 4px;
  }
  .course-holes-badge { margin-bottom: 14px; }
  .tee-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .tee-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 7px 10px;
    background: var(--bg);
    border-radius: 8px;
  }
  .tee-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .tee-name { font-weight: 600; color: var(--text); flex: 1; }
  .tee-meta { color: var(--text-muted); font-size: 12px; }
  .course-par-line { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; line-height:1.4; }
  .course-actions {
    display: flex;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--border-lt);
  }

  .btn {
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    font-size: 14px;
    padding: 10px 20px;
    letter-spacing: 0.2px;
  }
  .btn-gold { background: var(--gold); color: #fff; }
  .btn-gold:hover { background: var(--gold-lt); transform: translateY(-1px); box-shadow: 0 3px 12px rgba(184,148,42,0.3); }
  .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text-mid); }
  .btn-outline:hover { border-color: var(--green-md); color: var(--green-dk); }
  .btn-ghost { background: var(--bg); color: var(--text-mid); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--green-pale); color: var(--green-dk); border-color: var(--green-pale); }
  .btn-danger { background: rgba(192,57,43,0.08); color: #c0392b; border: 1px solid rgba(192,57,43,0.2); }
  .btn-danger:hover { background: rgba(192,57,43,0.15); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-lg { padding: 13px 28px; font-size: 15px; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,40,20,0.45);
    backdrop-filter: blur(3px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 600px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.22s ease;
  }
  .modal-wide { max-width: 740px; }
  @keyframes slideUp {
    from { transform: translateY(18px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    color: var(--green-dk);
    margin-bottom: 22px;
  }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-lt); }

  .form-group { margin-bottom: 16px; }
  .form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.9px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 9px 13px;
    outline: none;
    transition: border-color 0.18s, background 0.18s;
  }
  input:focus, select:focus { border-color: var(--green-md); background: #fff; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .seg-control {
    display: flex;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    gap: 3px;
    height: 40px;
  }
  .seg-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .seg-btn.active { background: var(--green-dk); color: #fff; }

  .tees-editor { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .tee-editor-row {
    display: grid;
    grid-template-columns: 36px 1fr 80px 80px 36px;
    gap: 8px;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .tee-color-input {
    width: 28px;
    height: 28px;
    padding: 2px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    background: none;
  }
  .tee-editor-row input[type="text"],
  .tee-editor-row input[type="number"] { margin: 0; padding: 7px 10px; font-size: 13px; }
  .tee-remove-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
    border-radius: 5px;
    transition: color 0.18s;
  }
  .tee-remove-btn:hover { color: var(--red); }
  .tee-editor-header {
    display: grid;
    grid-template-columns: 36px 1fr 80px 80px 36px;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 10px;
    margin-bottom: 4px;
  }

  .par-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .par-cell { text-align: center; }
  .par-hole-lbl { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }

  .hole-col {
    text-align: center;
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 4px 8px;
    box-shadow: var(--shadow);
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
  }
  .hole-col:focus-within {
    border-color: var(--green-md);
    box-shadow: 0 4px 18px rgba(44,79,44,0.18);
    transform: translateY(-2px);
  }
  .hole-col.has-value { border-color: var(--green-pale); background: #f4faf2; }
  .hole-num  {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 2px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .hole-par  {
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .hole-input {
    width: 100%;
    padding: 0;
    height: 64px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    border-radius: 10px;
    min-width: 0;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--green-dk);
    outline: none;
    transition: all 0.18s;
    -moz-appearance: textfield;
    line-height: 1;
  }
  .hole-input::placeholder { color: var(--border); font-weight: 400; }
  .hole-input:focus {
    border-color: var(--gold);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(184,148,42,0.15);
  }
  .hole-input.filled { background: #fff; border-color: var(--green-pale); }
  .hole-stb {
    font-size: 13px;
    margin-top: 6px;
    height: 18px;
    color: var(--green-md);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .hole-stb.zero { color: var(--border); font-weight: 500; }

  .score-summary-bar {
    background: var(--gold-pale);
    border: 1px solid rgba(184,148,42,0.25);
    border-radius: 16px;
    padding: 22px 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .summ-item { text-align: center; }
  .summ-num  {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--green-dk);
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .summ-lbl  {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .badge-9  { background: rgba(184,148,42,0.12); color: var(--gold); }
  .badge-18 { background: rgba(44,79,44,0.1);    color: var(--green-md); }
  .diff-pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    background: rgba(44,79,44,0.1);
    color: var(--green-dk);
    font-size: 12px;
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 44px; margin-bottom: 10px; }
  .empty-text { font-size: 15px; margin-bottom: 18px; }

  .divider {
    border: none;
    border-top: 1px solid var(--border-lt);
    margin: 18px 0;
  }

  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--green-dk);
    color: #c8dfc4;
    padding: 13px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(200,223,196,0.2);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ── AUTH UI ── */
  .auth-area { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .auth-btn {
    background: #d4ae48;
    color: #1c2e1c;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .auth-btn:hover { background: #e0c172; transform: translateY(-1px); }
  .auth-user {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #c8dfc4;
  }
  .auth-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid rgba(212,174,72,0.4);
  }
  .auth-name { font-weight: 500; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .signout-btn {
    background: none;
    border: 1px solid rgba(200,223,196,0.25);
    color: rgba(200,223,196,0.75);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.18s;
  }
  .signout-btn:hover { color: #fff; border-color: rgba(200,223,196,0.5); }
  .sync-indicator {
    font-size: 11px;
    color: rgba(200,223,196,0.5);
    margin-left: 4px;
  }
  .sync-indicator.syncing { color: #d4ae48; }
  .sync-indicator.synced { color: #7ecf7e; }
  .sync-indicator.offline { color: #e8a04a; }

  /* Sign-in modal screen */
  .signin-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .signin-overlay.show { display: flex; }
  .signin-card {
    text-align: center;
    max-width: 420px;
  }
  .signin-logo {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: var(--green-dk);
    margin-bottom: 6px;
  }
  .signin-logo span { color: var(--gold); }
  .signin-sub { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; line-height: 1.5; }
  .google-btn {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    transition: all 0.18s;
    box-shadow: var(--shadow);
  }
  .google-btn:hover { border-color: var(--green-md); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .google-icon { width: 20px; height: 20px; }

  @media (max-width: 620px) {
    .auth-name { max-width: 70px; font-size: 12px; }
    .auth-avatar { width: 24px; height: 24px; }
    .signout-btn { padding: 4px 8px; font-size: 11px; }
  }

  @media (max-width: 620px) {
    .header-inner { gap: 12px; }
    .nav-btn { padding: 6px 10px; font-size: 13px; }
    .stats-row { gap: 8px; }
    .stat-num { font-size: 22px; }
    .score-row { grid-template-columns: 1fr auto auto auto; padding: 12px 14px; }
    .score-stableford { display: none; }
    .main { padding: 20px 14px 60px; }
    .form-row { grid-template-columns: 1fr; }
    .tee-editor-row, .tee-editor-header { grid-template-columns: 28px 1fr 65px 65px 28px; gap: 5px; }
    .modal { padding: 22px; }
    .hcp-value { font-size: 60px; }
    .hcp-hero { padding: 30px 20px; }
    .holes-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 10px !important; }
    .hole-input { height: 72px; font-size: 42px; }
    .hole-num { font-size: 15px; }
